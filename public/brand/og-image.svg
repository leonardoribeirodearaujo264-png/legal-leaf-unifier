    <rect width="140" height="140" rx="24" fill="rgba(212,175,55,0.08)" stroke="rgba(212,175,55,0.25)" stroke-width="1.5"/>
    <!-- Top knob -->
    <circle cx="70" cy="20" r="7" fill="url(#gold)"/>
    <!-- Pole -->
    <rect x="66.5" y="20" width="7" height="74" rx="3.5" fill="url(#gold)"/>
    <!-- Crossbeam -->
    <rect x="14" y="52" width="112" height="7" rx="3.5" fill="url(#gold)"/>
    <!-- End caps -->
    <circle cx="14" cy="55.5" r="7" fill="url(#gold)"/>
    <circle cx="126" cy="55.5" r="7" fill="url(#gold)"/>
    <!-- Left cord -->
    <rect x="11" y="62" width="6" height="28" rx="3" fill="url(#gold)" opacity="0.85"/>
    <!-- Right cord -->
    <rect x="123" y="62" width="6" height="28" rx="3" fill="url(#gold)" opacity="0.85"/>
    <!-- Left pan -->
    <path d="-4 90 Q14 110 32 90" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-4 90 Q14 110 32 90" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right pan -->
    <path d="M108 90 Q126 110 144 90" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Base -->
    <rect x="52" y="94" width="36" height="7" rx="3.5" fill="url(#gold)" opacity="0.9"/>
