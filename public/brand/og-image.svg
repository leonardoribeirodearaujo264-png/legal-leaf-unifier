    <circle cx="1100" cy="170" r="3.5"/> <circle cx="1150" cy="170" r="3.5"/>
    <circle cx="800" cy="220" r="3.5"/> <circle cx="850" cy="220" r="3.5"/> <circle cx="900" cy="220" r="3.5"/>
    <circle cx="950" cy="220" r="3.5"/> <circle cx="1000" cy="220" r="3.5"/> <circle cx="1050" cy="220" r="3.5"/>
    <circle cx="1100" cy="220" r="3.5"/> <circle cx="1150" cy="220" r="3.5"/>
    <circle cx="800" cy="270" r="3.5"/> <circle cx="850" cy="270" r="3.5"/> <circle cx="900" cy="270" r="3.5"/>
    <circle cx="950" cy="270" r="3.5"/> <circle cx="1000" cy="270" r="3.5"/> <circle cx="1050" cy="270" r="3.5"/>
    <circle cx="1100" cy="270" r="3.5"/> <circle cx="1150" cy="270" r="3.5"/>
    <circle cx="800" cy="320" r="3.5"/> <circle cx="850" cy="320" r="3.5"/> <circle cx="900" cy="320" r="3.5"/>
    <circle cx="950" cy="320" r="3.5"/> <circle cx="1000" cy="320" r="3.5"/> <circle cx="1050" cy="320" r="3.5"/>
    <circle cx="1100" cy="320" r="3.5"/> <circle cx="1150" cy="320" r="3.5"/>
    <circle cx="800" cy="370" r="3.5"/> <circle cx="850" cy="370" r="3.5"/> <circle cx="900" cy="370" r="3.5"/>
    <circle cx="950" cy="370" r="3.5"/> <circle cx="1000" cy="370" r="3.5"/> <circle cx="1050" cy="370" r="3.5"/>
    <circle cx="1100" cy="370" r="3.5"/> <circle cx="1150" cy="370" r="3.5"/>
    <circle cx="800" cy="420" r="3.5"/> <circle cx="850" cy="420" r="3.5"/> <circle cx="900" cy="420" r="3.5"/>
    <circle cx="950" cy="420" r="3.5"/> <circle cx="1000" cy="420" r="3.5"/> <circle cx="1050" cy="420" r="3.5"/>
    <circle cx="1100" cy="420" r="3.5"/> <circle cx="1150" cy="420" r="3.5"/>
    <circle cx="800" cy="470" r="3.5"/> <circle cx="850" cy="470" r="3.5"/> <circle cx="900" cy="470" r="3.5"/>
    <circle cx="950" cy="470" r="3.5"/> <circle cx="1000" cy="470" r="3.5"/> <circle cx="1050" cy="470" r="3.5"/>
    <circle cx="1100" cy="470" r="3.5"/> <circle cx="1150" cy="470" r="3.5"/>
    <circle cx="800" cy="520" r="3.5"/> <circle cx="850" cy="520" r="3.5"/> <circle cx="900" cy="520" r="3.5"/>
    <circle cx="950" cy="520" r="3.5"/> <circle cx="1000" cy="520" r="3.5"/> <circle cx="1050" cy="520" r="3.5"/>
    <circle cx="1100" cy="520" r="3.5"/> <circle cx="1150" cy="520" r="3.5"/>
