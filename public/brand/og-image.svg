  <!-- Badge 1 -->
  <rect x="240" y="316" width="225" height="42" rx="21"
        fill="rgba(212,175,55,0.10)" stroke="rgba(212,175,55,0.45)" stroke-width="1.25"/>
  <text x="263" y="342" font-family="-apple-system, sans-serif" font-size="17"
        font-weight="600" fill="#D4AF37">⚖️  Assistentes Jurídicos</text>

  <!-- Badge 2 -->
  <rect x="478" y="316" width="200" height="42" rx="21"
        fill="rgba(212,175,55,0.10)" stroke="rgba(212,175,55,0.45)" stroke-width="1.25"/>
  <text x="501" y="342" font-family="-apple-system, sans-serif" font-size="17"
        font-weight="600" fill="#D4AF37">📁  Gestão Processual</text>

  <!-- Badge 3 -->
