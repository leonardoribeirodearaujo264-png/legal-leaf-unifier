<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C49A0A"/>
    </linearGradient>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1829"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bgMain)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.028)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="90" y1="0" x2="90" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="270" y1="0" x2="270" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="630" y1="0" x2="630" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="810" y1="0" x2="810" y2="630"/>
