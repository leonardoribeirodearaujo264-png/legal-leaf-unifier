  </g>

  <!-- ══ Main title: Tribuna IA ══ -->
  <text x="238" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="-1">
    <tspan fill="white">Tribuna </tspan><tspan fill="#D4AF37">IA</tspan>
  </text>

  <!-- Subtitle -->
